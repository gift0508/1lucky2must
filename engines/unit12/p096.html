window.__PROB__ = {"id": 96, "head": "[제1문] 2011년 일행 기출문제 제1문 4)", "type": "", "q": ["서울특별시 X구에 위치한 대학입학전문상담사로 근무하는 甲은 과학적이고 체계적인 학생입학지도를 위해 ‘공공기관의 정보공개에 관한 법률’에 따라 교육과학기술부장관 乙에게 학교별 성적분포도를 포함하여 서울지역 2010년 대학수학능력시험평가 원데이터에 대한 정보(수능시험정보)의 공개를 청구하였다. 이에 대해 乙은 甲의 청구대로 응할 경우 학교의 서열화를 야기할 뿐만 아니라 업무의 공정한 수행에 현저한 지장을 초래한다는 이유로 비공개결정을 하였다. 甲의 권리구제와 관련하여 다음의 질문에 답하시오.(단, 무효확인심판과 무효확인소송은 제외한다.) 만약 甲이 취소소송을 제기하여 인용판결이 확정되었음에도 불구하고 乙이 계속 정보를 공개하지 않을 경우 甲의 권리구제를 위한 행정소송법상 실효성 확보수단과 그 요건 및 성질에 대해 기술하시오. (10점)"], "blocks": [{"kind": "roman", "h": "Ⅰ. 문제의 소재", "subs": [], "body": ["행정소송법(이하 동법) 제34조 제1항에 의하면 행정청이 동법 제30조 제2항의 규정에 의한 처분을 하지 아니하는 때에는 제1심수소법원은 당사자의 신청에 의하여 결정으로써 상당한 기간을 정하고 행정청이 그 기간 내에 이행하지 아니하는 때에는 그 지연기간에 따라 일정한 배상을 할 것을 명하거나 즉시 손해배상을 할 것을 명할 수 있다. 동법 제제30조 제2항에 의하면 판결에 의하여 취소되는 처분이 당사자의 신청을 거부하는 것을 내용으로 하는 경우에는 그 처분을 행한 행정청은 판결의 취지에 따라 다시 이전의 신청에 대한 처분을 하여야 한다. 기속력의 내용 중 재처분의무불이행에 대한 행정소송법상 실효성 확보수단은 간접강제이다. 만약 甲이 취소소송을 제기하여 인용판결이 확정되었음에도 불구하고 乙이 계속 정보를 공개하지 않을 경우 甲의 권리구제를 위한 행정소송법상 실효성 확보수단의 요건 및 성질과 관련하여 첫째, 甲이 취소소송을 제기하여 인용판결이 확정되었음에도 불구하고 乙이 계속 정보를 공개하지 않을 경우 간접강제의 요건을 충족하는지 문제된다. 둘째, 간접강제의 법적 성질이 문제된다."], "role": "frame"}, {"kind": "roman", "h": "Ⅱ. 간접강제의 요건을 충족하는지 여부", "subs": [{"l": 2, "t": "1. 간접강제의 인용요건"}, {"l": 2, "t": "2. 사안의 경우"}], "body": [], "role": "issue"}, {"kind": "roman", "h": "Ⅲ. 간접강제의 법적 성질", "subs": [], "body": [], "role": "issue"}, {"kind": "roman", "h": "Ⅳ. 설문의 해결", "subs": [], "body": ["甲의 취소소송에 대해 취소인용판결이 확정되었음에도 불구하고 乙이 계속 정보를 공개하지 않을 경우 동법", "제34조 제1항에 의하여 제1심수소법원은 당사자인 甲의 신청에 의해 간접강제결정을 할 수 있다. 다만 그에 기한 배상금의 법적 성질은 심리적 강제수단이므로 지연기간이 지난 후일 지라도 을이 정보를 공개하면 그 지연배상금을 추심할 수 없다."], "role": "answer"}]};

<script>

var P = window.__PROB__;      // 문제 데이터
var U = window.__UNIT__;      // {id,title}
var OX = window.__OX__ || []; // 이 문제의 OX 뱅크

var FRAMES = [
 {t:"취소소송 제기의 적법요건 (7)", s:["① 대상적격 — 처분등","② 원고적격 — 법률상 이익","③ 피고적격 — 처분청","④ 협의의 소익","⑤ 제소기간","⑥ 관할법원 (선결문제 포함)","⑦ 행정심판전치 (해당 시)"]},
 {t:"본안 인용요건", s:["① 처분의 위법성 — 법령 위반 (주체·절차·형식·내용)","② 위법성 판단 기준시","③ 위법성의 정도 (취소/무효 구별)"]},
 {t:"무효등확인소송", s:["① 대상적격 ② 원고적격 ③ 협의의 소익(확인의 이익·보충성)","④ 무효사유 — 중대명백설"]},
 {t:"부작위위법확인소송", s:["① 당사자의 신청 ② 법규상·조리상 신청권","③ 상당한 기간 ④ 처분의 부존재(무응답)"]},
 {t:"당사자소송", s:["① 공법상 법률관계 여부","② 당사자적격 ③ 확인소송이면 확인의 이익"]},
 {t:"가구제 (집행정지)", s:["① 적법한 본안소송 계속 ② 처분의 존재","③ 회복하기 어려운 손해 ④ 긴급한 필요","⑤ 공공복리 중대영향 없을 것"]}
];

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }
var ST = load();
if(!ST.fc) ST.fc={};      // 플래시카드 pid→{know,dont}
if(!ST.ox) ST.ox={c:0,w:0};

if(!ST.visited) ST.visited={};

var $=function(id){ return document.getElementById(id); };
function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }

function frameOf(){ var r=null; P.blocks.forEach(function(b){ if(!r&&b.role==="frame") r=b; }); return r; }
function issueGroups(){ var g=[],m=null; P.blocks.forEach(function(b){ if(b.role==="mid")m=b.h; if(b.role==="issue"){g.push({mid:m,b:b});m=null;} }); return g; }
function answersOf(){ var o=[],m=""; P.blocks.forEach(function(b){ if(b.role==="mid")m=b.h; if(b.role==="answer")o.push({mid:m,h:b.h,body:b.body}); }); return o; }
function precs(){ var o=[]; P.blocks.forEach(function(b){ if(b.prec) o.push({iss:b.h,prec:b.prec}); }); return o; }

/* ─ 탭 ─ */
var TABS=[["case","사례"],["frame","대전제 설정"],["extract","모든 소전제 추출"],["sift","소전제 분별"],
["outline","목차 설정과 사안포섭"],["answer","설문의 해결"],["fc","플래시카드"],["ox","OX문제"],
["prec","필수암기판례"],["map","마인드맵"],["ai","AI상담"]];
var curTab="case";
function go(tab){
  curTab=tab; ST.visited[tab]=1; save();
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.k===tab); });
  var el=document.querySelector('.tab[data-k="'+tab+'"]'); if(el) el.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  render();
}
function hideBox(id, inner){
  return '<div class="hidebox" id="'+id+'" onclick="this.classList.toggle(\'revealed\')">'
   +'<div class="hb-tip">가리고 떠올린 뒤 탭하여 확인</div><div class="hb-body">'+inner+'</div></div>';
}
function render(){
  var h="";
  if(curTab==="case"){
    h+='<div class="card">'+(P.type?'<div class="type-tag">'+esc(P.type)+'</div>':'')
     +'<div class="probhead">'+esc(P.head)+'</div><div class="probbox">';

    }

  }
  else if(curTab==="frame"){

    if(f){ h+=hideBox("hb-frame",'<div class="ans-h">'+esc(f.h)+'</div>'+f.body.map(function(t){return '<p class="ans-p">'+esc(t)+'</p>';}).join("")); }
    else h+='<p class="ans-p">이 문제는 해설이 곧바로 쟁점 검토로 들어갑니다 — [소전제 분별] 탭에서 쟁점을 암기하세요.</p>';
    h+='</div>';
  }
  else if(curTab==="extract"){
    h+='<div class="card"><div class="lead">대전제에서 나올 수 있는 소전제를 <b>은닉된 것까지 전부</b> 암기합니다. 지도를 가리고 전수 암송 → 탭하여 대조.</div>';
    var inner=FRAMES.map(function(f){ return '<div class="fr-t">'+esc(f.t)+'</div>'+f.s.map(function(s){return '<div class="fr-i">'+esc(s)+'</div>';}).join(""); }).join("");
    h+=hideBox("hb-ext", inner)+'</div>';
  }
  else if(curTab==="sift"){
    var gs=issueGroups();
    h+='<div class="card"><div class="lead">이 사안에서 <b>문제되는 소전제</b>만 골라내는 것이 분별입니다. 가리고: "이 문제의 쟁점은 몇 개, 무엇?"</div>';
    var inner='<div class="ans-h">문제되는 소전제 ('+gs.length+')</div>';
    gs.forEach(function(g){ if(g.mid) inner+='<div class="mid-h">'+esc(g.mid)+'</div>'; inner+='<div class="iss">'+esc(g.b.h)+'</div>'; });
    inner+='<p class="ans-p" style="color:#886600;">여기 없는 소전제는 "문제되지 않는다" 한 문장 처리 — 은닉 소전제 관리</p>';
    h+=hideBox("hb-sift", inner)+'</div>';
  }
  else if(curTab==="outline"){
    h+='<div class="card"><div class="lead">쟁점별 <b>목차와 포섭 골격</b>입니다. 목차 흐름을 통째로 암기하세요 (법리 전문·포섭 전개는 교재 해설).</div>';
    var inner="";
    var m=null;
    P.blocks.forEach(function(b){
      if(b.role==="mid"){ inner+='<div class="mid-h">'+esc(b.h)+'</div>'; return; }
      if(b.role==="frame"||b.role==="issue"||b.role==="answer"){
        inner+='<div class="toc l1">'+esc(b.h)+'</div>';
        b.subs.forEach(function(s){ inner+='<div class="toc l'+s.l+'">'+esc(s.t)+'</div>'; });
      }
    });
    h+=hideBox("hb-out", inner)+'</div>';
  }
  else if(curTab==="answer"){
    var ans=answersOf();
    h+='<div class="card"><div class="lead">발문에 대한 <b>결론</b>입니다. 가린 상태에서 결론을 한 문장으로 말한 뒤 확인.</div>';
    if(ans.length){
      var inner="";
      ans.forEach(function(a){ if(a.mid) inner+='<div class="mid-h">'+esc(a.mid)+'</div>';
        inner+='<div class="ans-h">'+esc(a.h)+'</div>'+a.body.map(function(t){return '<p class="ans-p">'+esc(t)+'</p>';}).join(""); });
      h+=hideBox("hb-ans", inner);
    } else h+='<p class="ans-p">이 문제의 결론은 교재 해설 말미에서 확인하세요.</p>';
    h+='</div>';
  }
  else if(curTab==="fc"){ h+=fcHTML(); }
  else if(curTab==="ox"){ h+=oxHTML(); }
  else if(curTab==="prec"){
    var pr=precs();
    h+='<div class="card"><div class="lead">이 문제의 <b>필수암기판례</b> — 요지를 가리고 암송 → 탭 확인 → 암기되면 체크.</div>';
    if(!pr.length) h+='<p class="ans-p">이 문제에는 별도 판례 요지 카드가 없습니다.</p>';
    pr.forEach(function(x,i){
      var ck=ST.mem["m"+i]? " checked":"";
      h+='<div class="prec-card"><div class="prec-iss">'+esc(x.iss)+'</div>'
       +hideBox("hb-prec"+i,'<p class="ans-p">'+esc(x.prec)+'</p>')
       +'<label class="memck"><input type="checkbox" onchange="memChk('+i+',this.checked)"'+ck+'> 암기 완료</label></div>';
    });
    h+='</div>';
  }
  else if(curTab==="map"){ h+=mapHTML(); }
  else if(curTab==="ai"){ h+=aiHTML(); }
  $("content").innerHTML=h;
  if(curTab==="fc") fcMount();
  if(curTab==="ox") oxMount();
  window.scrollTo(0,0);
}

/* ─ 플래시카드 ─ */
var deck=[], fi=0, flipped=false;
function buildDeck(){
  deck=[];
  var f=frameOf();
  if(f) deck.push({f:"발문에서 세울 대전제는?", b:'<div class="ans-h">'+esc(f.h)+'</div>'+f.body.map(function(t){return '<p class="ans-p">'+esc(t)+'</p>';}).join("")});
  issueGroups().forEach(function(g){
    var subs=g.b.subs.map(function(s){return '<div class="toc l'+s.l+'">'+esc(s.t)+'</div>';}).join("");
    deck.push({f:"쟁점 「"+g.b.h+"」의 하위 목차는?", b: subs||'<p class="ans-p">판례 → 사안의 경우</p>'});
    if(g.b.prec) deck.push({f:"「"+g.b.h+"」 판례의 태도는?", b:'<p class="ans-p">'+esc(g.b.prec)+'</p>'});
  });
  answersOf().forEach(function(a){ deck.push({f:(a.mid?a.mid+" — ":"")+"결론은?", b:a.body.map(function(t){return '<p class="ans-p">'+esc(t)+'</p>';}).join("")||'<p class="ans-p">교재 해설 참조</p>'}); });
}
function fcHTML(){
  return '<div class="card"><div class="lead">이 문제에서 뽑은 암기 카드입니다. 카드를 탭하면 뒤집힙니다.</div>'
   +'<div id="fc-stage"></div><div class="grade" id="fc-grade" style="display:none">'
   +'<button class="g-o" onclick="fcMark(1)">외웠다</button><button class="g-x" onclick="fcMark(0)">더 보자</button></div>'
   +'<div class="hint" id="fc-cnt"></div></div>';
}
function fcMount(){ buildDeck(); fi=0; fcShow(); }
function fcShow(){
  if(!deck.length){ $("fc-stage").innerHTML='<p class="ans-p">카드가 없습니다.</p>'; return; }
  if(fi>=deck.length){
    var again=deck.filter(function(c,i){ return !ST.fc["c"+i]; });
    $("fc-stage").innerHTML='<div class="fcard done"><div>한 바퀴 완료 · 외운 카드 '+(deck.length-again.length)+'/'+deck.length+'</div>'
      +'<button class="btn btn-gold" style="margin-top:10px" onclick="fcRestart()">다시 (안 외운 것부터)</button></div>';
    $("fc-grade").style.display="none"; $("fc-cnt").textContent=""; return;
  }
  var c=deck[fi]; flipped=false;
  $("fc-stage").innerHTML='<div class="fcard" onclick="fcFlip()"><div class="fc-side" id="fc-front">'+esc(c.f)+'</div>'
    +'<div class="fc-side fc-back" id="fc-back" style="display:none">'+c.b+'</div></div>';
  $("fc-grade").style.display="none";
  $("fc-cnt").textContent=(fi+1)+" / "+deck.length+(ST.fc["c"+fi]?" · 외움":"");
}
function fcFlip(){ flipped=!flipped; $("fc-front").style.display=flipped?"none":"block"; $("fc-back").style.display=flipped?"block":"none"; $("fc-grade").style.display=flipped?"flex":"none"; }
function fcMark(k){ if(k) ST.fc["c"+fi]=1; else delete ST.fc["c"+fi]; save(); fi++; fcShow(); }
function fcRestart(){
  var unknown=[]; deck.forEach(function(c,i){ if(!ST.fc["c"+i]) unknown.push(i); });
  if(unknown.length){ /* 재정렬: 안 외운 것 앞으로 */ var nd=unknown.map(function(i){return deck[i];}).concat(deck.filter(function(c,i){return ST.fc["c"+i];}));
    deck=nd; ST.fc={}; save(); }
  fi=0; fcShow();
}

/* ─ OX ─ */
var oxCur=null;
function oxHTML(){
  if(!OX.length) return '<div class="card"><div class="lead">OX 문제</div><p class="ans-p">이 문제에는 OX 문항이 없습니다. [필수암기판례]·[플래시카드]로 암기하세요.</p></div>';
  return '<div class="card"><div class="lead">판례의 태도로 <b>옳으면 O, 틀리면 X</b>.</div>'
   +'<div id="ox-q" class="ox-q"></div>'
   +'<div class="grade"><button class="g-o" onclick="oxPick(true)">O</button><button class="g-x" onclick="oxPick(false)">X</button></div>'
   +'<div id="ox-fb"></div><div class="hint" id="ox-score"></div></div>';
}
function oxMount(){ oxNext(); }
function oxNext(){
  var it=OX[Math.floor(Math.random()*OX.length)];
  var useNeg = it.n && Math.random()<0.5;
  oxCur={text: useNeg? it.n : it.s, ans: !useNeg, src: it.src, iss: it.iss};
  $("ox-q").textContent=oxCur.text;
  $("ox-fb").innerHTML=""; $("ox-score").textContent="정답 "+ST.ox.c+" · 오답 "+ST.ox.w;
}
function oxPick(v){
  var ok = (v===oxCur.ans);
  if(ok) ST.ox.c++; else ST.ox.w++;
  save();
  $("ox-fb").innerHTML='<div class="ox-fb '+(ok?"okk":"nok")+'">'+(ok?"정답":"오답")+' — 정답은 '+(oxCur.ans?"O":"X")
   +'<div class="ox-src">'+esc(oxCur.iss)+' · '+esc(oxCur.src)+'</div>'
   +'<button class="btn btn-navy btn-sm" style="margin-top:8px" onclick="oxNext()">다음 문제</button></div>';
  $("ox-score").textContent="정답 "+ST.ox.c+" · 오답 "+ST.ox.w;
}

/* ─ 마인드맵 ─ */
function mapHTML(){
  var f=frameOf(), gs=issueGroups(), ans=answersOf();
  function node(cls,label,children){
    return '<div class="mm '+cls+'"><div class="mm-l" onclick="var n=this.nextElementSibling;if(n)n.style.display=(n.style.display===\'none\'?\'block\':\'none\')">'+label+'</div>'
      +(children?'<div class="mm-c">'+children+'</div>':'')+'</div>';
  }
  var balmun=P.q.length? esc(P.q[P.q.length-1]).slice(0,80)+"…":"발문";
  var issHtml=gs.map(function(g){
    var subs=g.b.subs.map(function(s){ return node("mm3", esc(s.t), null); }).join("");
    if(g.b.prec) subs+=node("mm3 mmp","판례: "+esc(g.b.prec.slice(0,60))+"…",null);
    return node("mm2", esc(g.b.h), subs||null);
  }).join("");
  var ansHtml=ans.map(function(a){ return node("mm2 mma", esc(a.h), null); }).join("");
  var tree=node("mm1","발문 — "+balmun,
      node("mm2 mmf", f? esc(f.h):"대전제", null) + issHtml + ansHtml);
  return '<div class="card"><div class="lead">이 문제의 논리 구조를 가지째로 암기합니다. 가지를 탭하면 접히고 펼쳐집니다.</div>'+tree+'</div>';
}

/* ─ AI 상담 ─ */
function aiSummary(){
  var gs=issueGroups();
  return "[교재] 행정쟁송법 사례풀이(공인노무사) · "+U.title+"\n[문제] "+P.head+"\n[발문] "+(P.q[P.q.length-1]||"")
   +"\n[쟁점] "+gs.map(function(g){return g.b.h;}).join(" / ");
}
function aiHTML(){
  var cfg=window.AI_CONFIG||{};
  var ready=!!(cfg.endpoint||cfg.apiKey);
  var h='<div class="card"><div class="lead">이 문제에 대해 궁금한 점을 AI에게 물어보세요.</div>';
  if(ready){
    h+='<div id="ai-log" class="ai-log"></div>'
     +'<textarea id="ai-in" class="stage-inp" rows="2" placeholder="예: 이 문제에서 원고적격이 문제되는 이유가 뭐예요?"></textarea>'
     +'<div style="text-align:center;margin-top:8px;"><button class="btn btn-gold" onclick="aiSend()">질문하기</button></div>';
  } else {
    h+='<p class="ans-p">AI 상담은 준비중입니다. 아래 버튼으로 <b>문제 맥락 + 질문</b>을 복사해 사용 중인 AI(클로드 등)에 붙여넣어 질문할 수 있습니다.</p>'
     +'<textarea id="ai-in" class="stage-inp" rows="2" placeholder="질문을 적어주세요"></textarea>'
     +'<div style="text-align:center;margin-top:8px;"><button class="btn btn-navy" onclick="aiCopy()">문제 맥락과 함께 질문 복사</button></div>'
     +'<div class="hint" id="ai-copied"></div>';
  }
  return h+'</div>';
}
function aiCopy(){
  var q=$("ai-in").value||"(질문)";
  var txt=aiSummary()+"\n\n[질문] "+q+"\n\n위 사례문제의 맥락에서 질문에 답해줘. 법답5단체계(대전제→소전제→분별→해결→결론)의 관점에서 설명해줘.";
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ $("ai-copied").textContent="복사되었습니다 — AI 채팅창에 붙여넣으세요."; }); }
  else { var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); $("ai-copied").textContent="복사되었습니다."; }
}
function aiSend(){
  var cfg=window.AI_CONFIG||{}; var q=$("ai-in").value.trim(); if(!q) return;
  var log=$("ai-log");
  log.innerHTML+='<div class="ai-u">'+esc(q)+'</div>'; $("ai-in").value="";
  var body={model:cfg.model||"claude-sonnet-4-6",max_tokens:1000,
    system:"당신은 1행2필 행정법구조연구소의 행정쟁송법 조교입니다. 법답5단체계(발문→대전제→소전제 전수추출→분별→판례·포섭→결론)에 따라 간결히 답하세요. 다음 문제의 맥락입니다:\n"+aiSummary(),
    messages:[{role:"user",content:q}]};
  var url=cfg.endpoint||"https://api.anthropic.com/v1/messages";
  var hd={"Content-Type":"application/json"};
  if(cfg.apiKey){ hd["x-api-key"]=cfg.apiKey; hd["anthropic-version"]="2023-06-01"; hd["anthropic-dangerous-direct-browser-access"]="true"; }
  fetch(url,{method:"POST",headers:hd,body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){
    var t=(d.content||[]).map(function(c){return c.text||"";}).join("") || "(응답 없음)";
    log.innerHTML+='<div class="ai-a">'+esc(t)+'</div>'; log.scrollTop=log.scrollHeight;
  }).catch(function(e){ log.innerHTML+='<div class="ai-a">오류: '+esc(String(e))+'</div>'; });
}
function memChk(i,v){ if(v) ST.mem["m"+i]=1; else delete ST.mem["m"+i]; save(); }

window.go=go; window.fcFlip=fcFlip; window.fcMark=fcMark; window.fcRestart=fcRestart;
window.oxPick=oxPick; window.oxNext=oxNext; window.memChk=memChk; window.aiSend=aiSend; window.aiCopy=aiCopy;

var bar=$("tabs"); var th="";
TABS.forEach(function(t){ th+='<button class="tab" data-k="'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; });
bar.innerHTML=th;
go("case");

</script>
