에 관한 법률관계는 단순한 민사관계에 불과한 것이고, 행정소송절차에 따라야 하는 관계로 볼 수 없다."}], "answer": "甲이 취할 수 있는 행정소송법상 수단은 동법 제11조와 동법 제10조 제2항, 그리고 동법 제8조 제2항이나 그 승소 가능성은 없다.", "why_draft": true};

<script>

  h+='<p class="qref">발문: <b>'+esc(D.question)+'</b></p>';
  h+=hideBox('<p class="ans-p">'+esc(D.answer)+'</p>');
  h+='<div class="stepnav"><button class="btn btn-line btn-sm" onclick="goStep(\'sub\')">← 사안포섭</button><button class="btn btn-gold btn-sm" onclick="goStep(\'case\')">처음부터 다시</button></div></div>';
 }
 return h;
}

/* 플래시카드: 사고훈련 정본에서 생성 */
var deck=[], fi=0, flipped=false;
function buildDeck(){
 deck=[{f:"① 발문의 IF 변환은?", b:'<div class="dj">'+esc(D.daejeon.if_conv)+'</div>'},{f:"② SHOULD 문장은?", b:'<div class="dj">'+esc(D.daejeon.should)+'</div>'},{f:"③ 결론적 대전제는?", b:'<div class="dj">'+esc(D.daejeon.concl)+'</div>'},{f:"가능한 모든 소전제(사고 사슬)는?", b:'<div class="dj">'+esc(D.sojeon_v2.chain)+'</div>'},{f:"요건 두문자와 이 사안의 분별은?", b:'<p class="ans-p"><b>'+esc(D.sojeon_v2.mnemonic)+'</b> — '+esc(D.sojeon_v2.sift)+'</p>'}];
 D.sojeon.forEach(function(s,i){ deck.push({f:"소전제 "+(i+1)+"의 분기문은?", b:'<div class="sj c-'+s.color+'" style="margin:0;">'+esc(s.text)+'</div>'}); });
 D.outline.forEach(function(o){
  if(typeof o.layer==="number" && o.subs && o.subs.length){
   var c=colorOf(o.layer);
   deck.push({f:"「"+o.t+"」의 하위 목차는?", b:o.subs.map(function(s){return '<div class="toc ts tsc-'+c+'">'+esc(s)+'</div>';}).join("")});
  }
 });
 deck.push({f:"설문의 해결(결론)은?", b:'<p class="ans-p">'+esc(D.answer)+'</p>'});
}
function fcHTML(){ return '<div class="card"><div class="lead">사고훈련 정본에서 자동 생성된 카드입니다. 탭하여 뒤집기.</div><div id="fc-stage"></div><div class="grade" id="fc-grade" style="display:none"><button class="g-o" onclick="fcMark(1)">외웠다</button><button class="g-x" onclick="fcMark(0)">더 보자</button></div><div class="hint" id="fc-cnt"></div></div>'; }
function fcMount(){ buildDeck(); fi=0; fcShow(); }
function fcShow(){
 if(fi>=deck.length){ $("fc-stage").innerHTML='<div class="fcard done"><div>한 바퀴 완료</div><button class="btn btn-gold" style="margin-top:10px" onclick="fi=0;fcShow()">다시</button></div>'; $("fc-grade").style.display="none"; $("fc-cnt").textContent=""; return; }
 var c=deck[fi]; flipped=false;
 $("fc-stage").innerHTML='<div class="fcard" onclick="fcFlip()"><div id="fc-front" class="fc-side">'+esc(c.f)+'</div><div id="fc-back" class="fc-side fc-back" style="display:none">'+c.b+'</div></div>';
 $("fc-grade").style.display="none"; $("fc-cnt").textContent=(fi+1)+" / "+deck.length;
}
function fcFlip(){ flipped=!flipped; $("fc-front").style.display=flipped?"none":"block"; $("fc-back").style.display=flipped?"block":"none"; $("fc-grade").style.display=flipped?"flex":"none"; }
function fcMark(k){ if(k)ST.fc["c"+fi]=1; save(); fi++; fcShow(); }

function precHTML(){
 var h='<div class="card"><div class="lead">이 문제의 필수암기판례 — 요지를 가리고 암송 → 탭 확인 → 암기 체크.</div>';
 (D.precs||[]).forEach(function(x,i){
  h+='<div class="prec-card"><div class="prec-iss tc-'+colorOf(x.layer)+'">'+esc(x.title)+'</div>'
   +hideBox('<p class="ans-p">'+esc(x.text)+'</p>')
   +'<label class="memck"><input type="checkbox" onchange="ST.mem[\'m'+i+'\']=this.checked?1:0;save()"'+(ST.mem["m"+i]?" checked":"")+'> 암기 완료</label></div>';
 });
 if(!(D.precs||[]).length) h+='<div class="pending">판례 카드 정본 대기</div>';
 return h+'</div>';
}
function mapNodes(){
 var nodes=[];
 nodes.push({id:"q", lvl:0, color:null, label:"발문", content:"<p class='ans-p'><b>"+esc(D.question)+"</b></p>"});
 nodes.push({id:"dj", lvl:1, color:"navy", label:"대전제(3단)", content:"<div class='dj'>① "+esc(D.daejeon.if_conv)+"</div><div class='dj' style='margin-top:6px'>② "+esc(D.daejeon.should)+"</div><div class='dj' style='margin-top:6px'>③ "+esc(D.daejeon.concl)+"</div>"});
 D.sojeon.forEach(function(s,i){
  nodes.push({id:"sj"+i, lvl:1, color:s.color, label:"소전제 "+(i+1), content:"<div class='sj c-"+s.color+"' style='margin:0'>"+esc(s.text)+"</div>"});
  D.outline.forEach(function(o){
   if(o.layer===i){
    nodes.push({id:"o"+i, lvl:2, color:s.color, label:o.t, content: issueContent(i,o)});
    (o.subs||[]).forEach(function(sub,k){
     nodes.push({id:"o"+i+"_"+k, lvl:3, color:s.color, label:sub, content: subContent(i,sub)});
    });
   }
  });
 });
 nodes.push({id:"ans", lvl:1, color:"gold", label:"설문의 해결", content:"<p class='ans-p'>"+esc(D.answer)+"</p>"});
 return nodes;
}
function issueContent(i,o){
 var s=D.sojeon[i];
 var h="<div class='sj c-"+s.color+"' style='margin:0 0 8px'>"+esc(s.text)+"</div>";
 h+="<div style='font-size:12.5px;color:#666'>하위 전개: "+(o.subs||[]).map(esc).join(" → ")+"</div>";
 return h;
}
function subContent(i,sub){
 if(/판\s*례/.test(sub)){
  var pr=(D.precs||[]).filter(function(x){return x.layer===i;});
  if(pr.length) return "<p class='ans-p'>"+esc(pr[0].text)+"</p>";
 }
 if(/사안의 경우/.test(sub)) return "<div class='pending'>포섭 문장 — 정본 대기</div>";
 if(/소결/.test(sub)) return "<div class='pending'>소결 문장 — 정본 대기</div>";
 return "<div class='pending'>이 목차의 내용 정본 대기</div>";
}
var mapSel=null;
function mapHTML(){
 var nodes=mapNodes();
 var tree="";
 nodes.forEach(function(n){
  var c=n.color==="navy"?"":"tc-"+(n.color||"red");
  var cls="mnode lvl"+n.lvl+(mapSel===n.id?" sel":"");
  if(n.color==="navy") cls+=" mnavy"; if(n.color==="gold") cls+=" mgold";
  tree+="<div class='"+cls+"' onclick=\"mapPick('"+n.id+"')\"><span class='"+c+"'>"+esc(n.label)+"</span></div>";
 });
 var selNode=nodes.find(function(n){return n.id===mapSel;});
 var panel= selNode? "<div class='mp-h'>"+esc(selNode.label)+"</div>"+selNode.content
   : "<div class='pending'>왼쪽 트리에서 목차 노드를 터치하면 여기에 내용이 떠오릅니다.</div>";
 return "<div class='card'><div class='lead'>목차 하나하나가 노드입니다 — 터치하면 옆 패널에 내용이 떠오릅니다.</div>"
  +"<div class='mapwrap'><div class='maptree'>"+tree+"</div><div class='mappanel' id='mappanel'>"+panel+"</div></div></div>";
}
function mapPick(id){ mapSel=id; render(); var el=document.getElementById("mappanel"); if(el&&window.innerWidth<640) el.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function aiHTML(){
 return '<div class="card"><div class="lead">이 문제에 대해 AI에게 질문 — 아래 버튼으로 문제 맥락+질문을 복사해 붙여넣으세요.</div>'
  +'<textarea id="ai-in" class="inp" rows="2" placeholder="질문을 적어주세요"></textarea>'
  +'<div style="text-align:center;margin-top:8px;"><button class="btn btn-navy" onclick="aiCopy()">문제 맥락과 함께 질문 복사</button></div><div class="hint" id="ai-copied"></div></div>';
}
function aiCopy(){
 var q=$("ai-in").value||"(질문)";
 var txt="[문제] "+D.head+"\n[발문] "+D.question+"\n[대전제] "+D.daejeon.concl+"\n[소전제 분별] "+D.sojeon_v2.sift+"\n\n[질문] "+q+"\n\n법답5단체계(대전제→소전제→목차→포섭→결론)의 관점에서 답해줘.";
 if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){$("ai-copied").textContent="복사되었습니다 — AI 채팅창에 붙여넣으세요.";});}
}
function oxHTML(){ return '<div class="card"><div class="lead">OX문제</div><div class="pending">OX 뱅크는 정본 검수 후 탑재 예정입니다 (자동 어미 반전 방식은 폐기).</div></div>'; }

function render(){
 var h="";
 if(curMenu==="think") h=thinkHTML();
 else if(curMenu==="fc") h=fcHTML();
 else if(curMenu==="ox") h=oxHTML();
 else if(curMenu==="prec") h=precHTML();
 else if(curMenu==="map") h=mapHTML();
 else if(curMenu==="ai") h=aiHTML();
 $("content").innerHTML=h;
 if(curMenu==="fc") fcMount();
}
var th=""; MENUS.forEach(function(m){th+='<button class="tab" data-k="'+m[0]+'" onclick="goMenu(\''+m[0]+'\')">'+m[1]+'</button>';});
$("tabs").innerHTML=th;
var sh=""; STEPS.forEach(function(s){sh+='<button class="stab" data-k="'+s[0]+'" onclick="goStep(\''+s[0]+'\')">'+s[1]+'</button>';});
$("subbar").innerHTML=sh;
window.goMenu=goMenu; window.goStep=goStep; window.fcFlip=fcFlip; window.fcMark=fcMark; window.aiCopy=aiCopy; window.mapPick=mapPick; window.save=save; window.ST=ST;
goMenu("think"); goStep("case");

</script>
